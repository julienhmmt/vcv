# TLS with HTTP/2 and the Host rewritten to an internal name, like an external
# HAProxy in front of a Kubernetes Gateway. The original host is carried in
# X-Forwarded-Host: without it the app builds an http://app:52000 CSRF target
# origin and every admin POST is a 403 (app.trust_proxy is on in dev).
global
  log stdout format raw local0 info

# Docker's DNS: follow the app across container recreations.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend https
  bind :53005 ssl crt /certs/haproxy.pem alpn h2,http/1.1
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Host %[req.hdr(Host)]
  http-request set-header X-Forwarded-For %[src]
  http-request set-header Host app:52000
  default_backend vcv

backend vcv
  server vcv app:52000 resolvers docker init-addr last,libc,none
