# HTTPS terminator in front of vcv (plain HTTP on :52000 behind it).
# X-Forwarded-Host/Proto are what app.trust_proxy reads for the CSRF
# target origin; without them every admin POST is a 403.
server {
  listen 53001 ssl;
  http2 on;
  server_name localhost;

  ssl_certificate     /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;

  # Docker's DNS plus a variable upstream: nginx re-resolves the app instead of
  # keeping the IP it saw at startup.
  resolver 127.0.0.11 valid=5s;
  set $vcv http://app:52000;

  location / {
    proxy_pass $vcv;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }
}
