---
services:
  vault-1.21:
    image: hashicorp/vault:1.21.4
    container_name: vault-1.21
    ports:
      - "8200:8200/tcp"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: "sh /vault-dev-init.sh vault-1.21 pki pki_dev pki_stage pki_production"
    networks:
      - vcv-network
    volumes:
      - ./vault-dev-init.sh:/vault-dev-init.sh:ro

  vault-2.0:
    image: hashicorp/vault:2.0.4
    container_name: vault-2.0
    ports:
      - "8201:8200/tcp"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: "sh /vault-dev-init.sh vault-2.0 pki_vault_2_0 pki_corporate pki_external pki_partners"
    networks:
      - vcv-network
    volumes:
      - ./vault-dev-init.sh:/vault-dev-init.sh:ro

  vault-2.1:
    image: hashicorp/vault:2.1.2
    container_name: vault-2.1
    ports:
      - "8202:8200/tcp"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: "sh /vault-dev-init.sh vault-2.1 pki_vault_2_1 pki_cloud pki_edge pki_iot pki_blockchain"
    networks:
      - vcv-network
    volumes:
      - ./vault-dev-init.sh:/vault-dev-init.sh:ro

  vault-2.2:
    image: hashicorp/vault:2.2.2
    container_name: vault-2.2
    ports:
      - "8203:8200/tcp"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: "sh /vault-dev-init.sh vault-2.2 pki_vault_2_2 pki_cloud pki_edge pki_iot pki_blockchain"
    networks:
      - vcv-network
    volumes:
      - ./vault-dev-init.sh:/vault-dev-init.sh:ro

  openbao-2.5:
    image: docker.io/openbao/openbao:2.5.5
    container_name: openbao-2.5
    ports:
      - "1337:1337/tcp"
    environment:
      - OPENBAO_DEV_ROOT_TOKEN_ID=root
      - OPENBAO_DEV_LISTEN_ADDRESS=0.0.0.0:1337
    cap_add:
      - IPC_LOCK
    command: "sh /openbao-dev-init.sh openbao-2.5 pki_openbao_2_5 pki_openbao_dev pki_openbao_stage pki_openbao_prod"
    networks:
      - vcv-network
    volumes:
      - ./openbao-dev-init.sh:/openbao-dev-init.sh:ro

  openbao-2.6:
    image: docker.io/openbao/openbao:2.6.5
    container_name: openbao-2.6
    ports:
      - "1338:1337/tcp"
    environment:
      - OPENBAO_DEV_ROOT_TOKEN_ID=root
      - OPENBAO_DEV_LISTEN_ADDRESS=0.0.0.0:1337
    cap_add:
      - IPC_LOCK
    command: "sh /openbao-dev-init.sh openbao-2.6 pki_openbao_2_6 pki_openbao_dev pki_openbao_stage pki_openbao_prod"
    networks:
      - vcv-network
    volumes:
      - ./openbao-dev-init.sh:/openbao-dev-init.sh:ro

  openbao-2.7:
    image: docker.io/openbao/openbao:2.7.2
    container_name: openbao-2.7
    ports:
      - "1339:1337/tcp"
    environment:
      - OPENBAO_DEV_ROOT_TOKEN_ID=root
      - OPENBAO_DEV_LISTEN_ADDRESS=0.0.0.0:1337
    cap_add:
      - IPC_LOCK
    command: "sh /openbao-dev-init.sh openbao-2.7 pki_openbao_2_7 pki_openbao_dev pki_openbao_stage pki_openbao_prod"
    networks:
      - vcv-network
    volumes:
      - ./openbao-dev-init.sh:/openbao-dev-init.sh:ro

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VERSION: ${VCV_VERSION:-dev}
    container_name: vcv
    ports:
      - "52000:52000/tcp"
    networks:
      - vcv-network
    depends_on:
      - vault-1.21
      - vault-2.0
      - vault-2.1
      - vault-2.2
      - openbao-2.5
      - openbao-2.6
      - openbao-2.7
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./vcv.log:/var/log/app/vcv.log
      - ./settings.dev.json:/app/settings.dev.json
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M

  # --- Reverse proxies in front of the app (one HTTPS port each) -----------
  # The app is still published on :52000 for the Vite dev server, but these
  # are the production-shaped paths: TLS terminated at the edge, plain HTTP to
  # the app. settings.dev.json sets app.trust_proxy: true, so each proxy must
  # send X-Forwarded-Host/-Proto or admin POSTs fail CSRF (403).
  # Configs: dev/proxies/. Test: `make proxy-e2e`.
  # Import dev/proxies/certs/ca.crt in the browser once to skip TLS warnings.
  proxy-certs:
    image: alpine:3.24
    container_name: vcv-proxy-certs
    restart: "no"
    command: /gen-cert.sh
    networks:
      - vcv-network
    volumes:
      - ./dev/proxies/gen-cert.sh:/gen-cert.sh:ro
      - ./dev/proxies/certs:/certs

  # 53001: nginx, the classic WebSocket/proxy_set_header recipe.
  proxy-nginx:
    image: nginx:stable-alpine
    container_name: vcv-proxy-nginx
    restart: unless-stopped
    ports:
      - "53001:53001/tcp"
    networks:
      - vcv-network
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      app:
        condition: service_started
    volumes:
      - ./dev/proxies/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dev/proxies/certs:/certs:ro

  # 53002: Caddy, HTTP/2 out of the box.
  proxy-caddy:
    image: caddy:2.11-alpine
    container_name: vcv-proxy-caddy
    restart: unless-stopped
    ports:
      - "53002:53002/tcp"
    networks:
      - vcv-network
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      app:
        condition: service_started
    volumes:
      - ./dev/proxies/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dev/proxies/certs:/certs:ro

  # 53003: Traefik (file provider).
  proxy-traefik:
    image: traefik:v3.6
    container_name: vcv-proxy-traefik
    restart: unless-stopped
    command:
      - --entrypoints.websecure.address=:53003
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "53003:53003/tcp"
    networks:
      - vcv-network
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      app:
        condition: service_started
    volumes:
      - ./dev/proxies/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./dev/proxies/certs:/certs:ro

networks:
  vcv-network:
    driver: bridge
