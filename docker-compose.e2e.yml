# E2E stack: lean subset of the dev stack (1 Vault + 1 OpenBao + app) with
# test-only credentials from settings.e2e.json. Run via `make e2e`.
# Host ports avoid clashing with a parallel `make dev` stack (app on 52001).
services:
  vault-2.2:
    image: hashicorp/vault:2.2.2
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: "sh /vault-dev-init.sh vault-2.2 pki pki_dev pki_stage pki_production"
    networks:
      - vcv-e2e
    volumes:
      - ./vault-dev-init.sh:/vault-dev-init.sh:ro

  openbao-2.7:
    image: docker.io/openbao/openbao:2.7.2
    environment:
      - OPENBAO_DEV_ROOT_TOKEN_ID=root
      - OPENBAO_DEV_LISTEN_ADDRESS=0.0.0.0:1337
    cap_add:
      - IPC_LOCK
    command: "sh /openbao-dev-init.sh openbao-2.7 pki_openbao pki_openbao_dev pki_openbao_stage pki_openbao_prod"
    networks:
      - vcv-e2e
    volumes:
      - ./openbao-dev-init.sh:/openbao-dev-init.sh:ro

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VERSION: ${VCV_VERSION:-e2e}
    ports:
      - "52001:52000/tcp"
    networks:
      - vcv-e2e
    depends_on:
      - vault-2.2
      - openbao-2.7
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./settings.e2e.json:/app/settings.dev.json:ro

networks:
  vcv-e2e:
    driver: bridge
