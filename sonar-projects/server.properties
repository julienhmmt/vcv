# SonarQube project: server (Go backend, module vcv at app/)
sonar.projectKey=vcv-server
sonar.projectName=VaultCertsViewer (Go)
sonar.projectVersion=1.0.0

sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*_test.go
sonar.language=go

sonar.exclusions=\
  **/vendor/**,\
  **/tmp/**,\
  **/*.db,\
  **/*.db-*,\
  **/graphify-*/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/web/**,\
  **/.DS_Store,\
  **/coverage.out

sonar.go.coverage.reportPaths=.sonar/server-coverage.out

sonar.coverage.exclusions=**/*_test.go

# ponytail: SCM disabled — sonarsource/sonar-scanner-cli is amd64-only and runs
# under Rosetta on Apple Silicon; its JGit blame step (SCM Publisher)
# intermittently stalls and hangs the scan. Upgrade path: run the scanner
# natively on arm64 (brew install sonar-scanner) and drop this line.
sonar.scm.disabled=true

sonar.sourceEncoding=UTF-8
