# SonarQube project: server (Go backend, module vcv at app/)
sonar.projectKey=vcv-server
sonar.projectName=VaultCertsViewer (Go)
sonar.projectVersion=1.0.0

sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*_test.go
sonar.language=go

sonar.exclusions=\
  **/vendor/**,\
  **/tmp/**,\
  **/*.db,\
  **/*.db-*,\
  **/graphify-*/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.DS_Store,\
  **/coverage.out

sonar.go.coverage.reportPaths=.sonar/server-coverage.out

sonar.coverage.exclusions=**/*_test.go

sonar.sourceEncoding=UTF-8
