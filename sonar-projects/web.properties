# SonarQube project: web (Svelte 5 SPA, vcv-web)
# Svelte components (.svelte) are indexed as files so that ESLint external
# issues can be attached, but excluded from JS/TS analysis (SonarQube cannot
# parse Svelte). ESLint runs via tools/sonar-frontend-lint.sh and imports
# issues (including .svelte) via sonar.externalIssuesReportPaths.
sonar.projectKey=vcv-web
sonar.projectName=VaultCertsViewer frontend
sonar.projectVersion=1.0.0

sonar.sources=app/web/frontend/src
sonar.language=ts,js,css,json,web

# Exclude generated/vendor artifacts from indexing.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.spec.ts

# Exclude .svelte from JS/TS analysis (parser can't handle Svelte syntax)
# but keep them indexed so external ESLint issues can be attached.
sonar.javascript.exclusions=**/*.svelte,**/*.svelte.ts,**/*.svelte.js

sonar.typescript.tsconfigPaths=app/web/frontend/tsconfig.app.json

# Import ESLint issues (covers .svelte + .ts files)
sonar.externalIssuesReportPaths=.sonar/web-eslint.json

# Vitest coverage (lcov) generated by tools/sonar-frontend-lint.sh
sonar.javascript.lcov.reportPaths=.sonar/web-lcov.info
sonar.typescript.lcov.reportPaths=.sonar/web-lcov.info

# Test files live alongside sources; tell SonarQube where they are so they
# are excluded from coverage computation and indexed as tests.
sonar.tests=app/web/frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# ponytail: SCM disabled — sonarsource/sonar-scanner-cli is amd64-only and runs
# under Rosetta on Apple Silicon; its JGit blame step (SCM Publisher)
# intermittently stalls and hangs the scan. SCM blame only feeds issue assignee
# + the non-default "specific developer" new-code period. Upgrade path: run the
# scanner natively on arm64 (brew install sonar-scanner) and drop this line.
sonar.scm.disabled=true

sonar.sourceEncoding=UTF-8
